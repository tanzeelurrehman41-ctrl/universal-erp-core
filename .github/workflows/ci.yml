name: Core CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/UniversalErp.sln

      - name: Build
        run: dotnet build src/backend/UniversalErp.sln --configuration Release --no-restore

      - name: Run tests that do not require a provisioned PostgreSQL fixture
        run: dotnet test src/backend/UniversalErp.sln --configuration Release --no-build --filter "FullyQualifiedName!~Postgres"

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
